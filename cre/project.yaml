# ==========================================================================
# CRE PROJECT SETTINGS FILE
# ==========================================================================
# RPC values use environment interpolation so no token lands in version
# control. Scripts/cre-run.ps1 loads the repository root .env into the
# process environment before any cre command runs.
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC_URL}

# ==========================================================================
production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC_URL}
